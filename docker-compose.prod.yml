version: '3.8'

services:
  webhook-to-telegram:
    build:
      context: .
      dockerfile: Dockerfile
    image: webhook-to-telegram:latest
    container_name: webhook-to-telegram
    ports:
      - "3000:3000"
    volumes:
      - data:/app/data
      - ./logs:/app/logs:rw
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_PATH=/app/data/database.db
      - TRUST_PROXY=${TRUST_PROXY:-loopback}
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/health', (res) => process.exit(res.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - webhook-network
    security_opt:
      - no-new-privileges:true
    read_only: false  # Set to true if app doesn't need to write files
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Optional: Add nginx reverse proxy
  nginx:
    image: nginx:1.31.8-alpine@sha256:1ef7ca94d7879df82421428ce13bd1eaa412404953859cf7a5b6512c25e67a60
    container_name: webhook-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./logs/nginx:/var/log/nginx:rw
    depends_on:
      webhook-to-telegram:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - webhook-network
    profiles:
      - nginx  # Only start with --profile nginx

volumes:
  data:
    driver: local

networks:
  webhook-network:
    driver: bridge
